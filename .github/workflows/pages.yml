name: Deploy NutriTrack to GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nutritrack/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: nutritrack

      - name: Build
        run: npm run build
        working-directory: nutritrack

      - name: Copy index.html as 404.html for SPA routing
        run: Copy-Item dist/index.html dist/404.html
        working-directory: nutritrack
        shell: pwsh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nutritrack/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
